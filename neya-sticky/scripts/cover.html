<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: "Poppins";
        font-weight: 800;
        src: url("fonts/poppins-800.woff2") format("woff2");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #0a0510;
      }
      #stage {
        position: relative;
        width: 1280px;
        height: 720px;
      }

      /* Blurred, zoomed backdrop fills the pillarbox sides — the same
         treatment YouTube uses when a vertical video plays in a wide
         player. Sized larger than the canvas so the blur never samples a
         transparent edge. */
      #bg-blur {
        position: absolute;
        inset: -80px;
        background-image: url("../assets/hf_20260526_225013_a148f707-f95f-4231-9952-368d1e40e359.png");
        background-size: cover;
        background-position: 50% 30%;
        filter: blur(45px) brightness(0.55) saturate(1.3);
        transform: scale(1.15);
      }

      /* The full, uncropped photo — letterboxed in the center, exact
         source aspect ratio (1152x2048) at full canvas height. */
      #photo-frame {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #photo-frame img {
        height: 720px;
        width: auto;
        display: block;
        box-shadow: 0 0 90px rgba(0, 0, 0, 0.6);
      }

      #title {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 40px;
        pointer-events: none;
      }
      #title span {
        font-family: "Poppins", "Inter", sans-serif;
        font-weight: 800;
        font-size: 74px;
        line-height: 1.1;
        color: #ffffff;
        -webkit-text-stroke: 2.5px #ffffff;
        text-shadow:
          0 0 14px rgba(36, 159, 192, 0.95),
          0 0 32px rgba(36, 159, 192, 0.8),
          0 0 60px rgba(36, 159, 192, 0.55);
        letter-spacing: 0.5px;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="bg-blur"></div>
      <div id="photo-frame">
        <img src="../assets/hf_20260526_225013_a148f707-f95f-4231-9952-368d1e40e359.png" />
      </div>
      <div id="title"><span>On My Wave</span></div>
    </div>
  </body>
</html>
